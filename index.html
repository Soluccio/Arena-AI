<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Belisco, o Gato Ninja</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #0b0b16;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: monospace;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #1a1a2e;
    }
    .touch { position: fixed; inset: 0; pointer-events: none; }
    .tleft, .tright { position: absolute; bottom: 18px; display: flex; gap: 12px; pointer-events: auto; }
    .tleft { left: 16px; }
    .tright { right: 16px; align-items: flex-end; }
    .tbtn {
      width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid #c62828;
      background: rgba(26, 26, 46, 0.6);
      color: #e8e8f0; font-size: 18px;
      touch-action: none; user-select: none;
    }
    .tbtn.big { width: 72px; height: 72px; border-color: #ffeb3b; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
